<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="One Message: From Lightning to Language. A continuous zoom from a lightning bolt to a single chat reply." />
    <title>One Message</title>
    <style>
      :root {
        --bg: #05070a;
        --ink: #e6edf3;
        --ink-quiet: #a7b1bd;
        --cyan: #3fd8ff;
        --amber: #ffb347;
        /* Opaque enough that text stays at 4.5:1 or better even over a white flash. */
        --panel: rgba(8, 12, 18, 0.88);
        --edge: rgba(230, 237, 243, 0.14);
        --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden; /* no scrollbars: time is driven by the scrubber, not page scroll */
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none; /* orbit gestures later; no page pan or zoom */
        outline: none;
      }

      /* HUD is DOM above the canvas. It ignores the pointer except on its controls. */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 16px max(16px, env(safe-area-inset-bottom));
        gap: 14px;
      }

      #caption {
        align-self: center;
        max-width: min(46ch, 100%);
        margin: 0;
        padding: 8px 14px;
        font-size: clamp(16px, 2.2vw, 22px);
        line-height: 1.3;
        text-align: center;
        text-wrap: balance;
        background: var(--panel);
        border-radius: 8px;
        min-height: 1.3em;
      }

      #controls {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 10px;
      }

      #playpause {
        flex: none;
        width: 44px;
        height: 44px;
        border: 1px solid var(--amber);
        border-radius: 50%;
        background: transparent;
        color: var(--amber);
        font-size: 16px;
        cursor: pointer;
      }
      #playpause:focus-visible,
      #scrubber:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
      }

      #playpause:disabled,
      #scrubber:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #scrubber {
        flex: 1;
        min-width: 0;
        accent-color: var(--amber);
        height: 44px;
        cursor: pointer;
      }

      #clock {
        flex: none;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink-quiet);
        font-variant-numeric: tabular-nums;
      }

      /* Debug overlay: hidden by default; main.ts toggles it with the D key or ?debug in the URL. */
      #debug {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 12px;
        margin: 0;
        padding: 8px 10px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.45;
        color: var(--cyan);
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 8px;
        pointer-events: none;
        white-space: pre;
      }
      #debug[hidden] {
        display: none;
      }
      /* When the shot table can't play, its problems go here: wrapped, scrollable and selectable. */
      #debug.problems {
        right: 12px;
        max-height: calc(100% - 180px);
        overflow: auto;
        overscroll-behavior: contain;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--ink);
        border-color: var(--amber);
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
      }

      noscript p {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        font-size: 18px;
      }

      /* Reduced motion: main.ts also reads this media query and skips autoplay. */
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="One Message: animated journey from lightning to a chat reply"></canvas>

    <div id="hud">
      <p id="caption" aria-live="polite"></p>
      <div id="controls">
        <button id="playpause" type="button" aria-label="Play">▶</button>
        <input
          id="scrubber"
          type="range"
          min="0"
          max="90"
          step="0.1"
          value="0"
          aria-label="Timeline, seconds"
        />
        <!-- A timer, not a live region: it changes ten times a second and must not be read out each time. -->
        <span id="clock" role="timer" aria-live="off">0:00.0 / 1:30</span>
      </div>
    </div>

    <pre id="debug" hidden></pre>

    <noscript><p>This experience needs JavaScript.</p></noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
